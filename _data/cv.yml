        location: Remote
        start_date: 2018-01
        summary: Conduct self-directed research on publicly observable payment fraud, authentication flows, and transaction risks.
        highlights:
          - Track publicly observable payment-abuse ecosystems, analyzing card-testing methodologies, BIN attack tools, and stolen-credential tradecraft across underground communities.
          - Audit transaction and authentication pipelines to identify missing caller authorization, weak session-transaction binding, and response-handling disclosures.
          - Translate complex technical vulnerabilities into structured risk reports and control recommendations for payment product, fraud, and security teams.

