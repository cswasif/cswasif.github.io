- title: Research and Projects
  type: time_table
  contents:
    - title: "The 3DS Oracle: BIN Attack via the Network"
      institution: "<a href=\"https://arxiv.org/abs/2610.32206\">arXiv:2610.32206</a> [cs.CR]"
      year: 2026
      description:
        - Lead author; arXiv preprint. Examines how client-visible EMV 3-D Secure responses can reveal pre-authorization card and issuer-control signals; combines standards analysis, formal modeling, and bounded evaluation to develop payment-risk and mitigation recommendations
    - title: "Prefix Count Limits Can Increase First-Hit Discovery in Card Reissuance"
      institution: "<a href=\"https://arxiv.org/abs/2609.31398\">arXiv:2609.31398</a> [cs.CR]"
      year: 2026
      description:
        - Lead author; arXiv preprint (arXiv:2609.31398). Identified situations in which caps on how many cards can share a number prefix can make active cards easier to find in a BIN attack (attempts to identify valid card numbers); demonstrated the effect in simulations using 50,000 synthetic candidates. The findings help banks and other card issuers assess reissuance policies for card-number discovery risk, rather than relying on count limits alone
    - title: "<a href=\"https://cnpshield.github.io/3dslab/\">EMV 3-D Secure Protocol Lab</a>"
      institution: "Public Research & Education Resource"
      year: 2025 - Present
      description:
        - Built a public, vendor-neutral reference site for comparing 3-D Secure participants, messages, and decision points across published specification versions

