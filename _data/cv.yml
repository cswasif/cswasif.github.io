          - Reverse engineer payment and authentication flows across gateway and orchestration patterns in support of protocol analysis and remediation design.
          - Built the EMV 3-D Secure Protocol Lab, an open vendor-neutral interactive reference for visualizing, comparing, and debugging browser and app 3DS flows across published spec versions.
          - Produce coordination-safe technical documentation and disclosure materials that translate high-level concerns into actionable engineering guidance.

      - company: BRAC University
