      - title: "Prefix Count Limits Can Increase First-Hit Discovery in Card Reissuance"
        authors:
          - Wasif Faisal
        date: 2026
        journal: "Under review for Financial Cryptography and Data Security (FC) 2027 (arXiv:2609.31398)"
        url: https://arxiv.org/abs/2609.31398
        highlights:
          - Lead author. Discovered structural conditions where prefix caps make active cards substantially easier to enumerate in BIN attacks (guessing valid card numbers).
