        summary: Lead a faculty-supervised academic research effort on payment protocols, fintech infrastructure, and protocol-security weaknesses relevant to fraud enablement and secure-by-design improvements.
        highlights:
          - Serve as lead author for thesis-driven and publication-oriented research on EMV 3DS flows, payment gateway behavior, and attacker-observable trust-boundary failures in real-world transaction systems.
          - Perform core technical analysis, research writing, and trace review for ongoing work on payment authentication, access-control weaknesses, and defensible remediation approaches.
          - Advance thesis work and manuscript development derived from the project, extending the analysis with new protocol-level findings and stronger evidence.
          - Support academic investigation of cryptographic auditing questions and entropy-related security issues in applied security contexts.

    Projects:
      - name: EMV 3-D Secure Protocol Lab
        summary: Open, vendor-neutral interactive reference for visualizing, comparing, and debugging EMV 3DS browser and app flows across published specification versions.
        url: https://github.com/cnpshield/3dslab
        highlights:
          - Mapped message flows, payload structures, and trust boundaries into a reusable research and teaching artifact for security researchers, payment engineers, and educators.
          - Added versioned payload registries, field-level provenance, and spec-annotation support so protocol behavior can be inspected with precise normative context.
          - Added reproducibility support through scenario snapshots, local payload validation, and threat-model documentation.

      - name: Ongoing Research on Payment Authentication Protocol Security
        summary: Multi-author faculty-supervised, thesis-aligned research project with manuscript development in progress for security-venue submission.
        highlights:
