        summary: Open, vendor-neutral interactive reference for visualizing and debugging browser and app 3DS flows across published specification versions.
        url: https://cnpshield.github.io/3dslab/
        highlights:
          - Architected an open, vendor-neutral interactive reference for visualizing, comparing, and debugging browser and app 3DS message flows, trust boundaries, and decision points across published specification versions.
